# Default values for plot-reel.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Plot Reel container image
image:
  repository: <IMAGE_REPOSITORY>  # e.g., myregistry/plot-reel
  pullPolicy: Always
  tag: <IMAGE_TAG>  # e.g., latest or a specific version

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "plot-reel-helm" # Replace with your desired release name if needed

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

# Kubernetes Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# OpenShift Route configuration
route:
  enabled: true
  host: ""  # e.g., plot-reel.example.com
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# Plot Reel default configuration (environment variables)
config:
  DATA_ROOT: /data_read # Replace with the path to your data directory
  SAVE_ROOT: /data_save # Replace with the path to your save directory
  URL_PREFIX: /         # Replace with the URL prefix if needed, or leave as "/" for root
  HOST: "0.0.0.0"       # Replace with the host your application should bind to
  PORT: "8080"          # Replace with the port your application listens on

# Secret data (encryption key and users file)
# Either provide base64-encoded content here, or set createSecret: false and use 'oc create secret' separately
secrets:
  create: true
  keyBase64: <BASE64_ENCODED_KEY>  # Replace with your base64-encoded encryption key
  userscsvBase64: <BASE64_ENCODED_USERS_CSV> # Replace with your base64-encoded users.csv using
  

# Persistent storage configuration
persistence:
  enabled: true
  size: 2Gi         # Replace Size of the Persistent Volume Claim
  storageClass: ""  # Leave empty for default storage class

# Container resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
